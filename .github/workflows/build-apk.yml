name: Build Smart Crypto Watch APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Unpack app source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q SmartCryptoWatch-GitHubBuild.zip -d buildsrc

      - name: Make compatibility build
        working-directory: buildsrc/SmartCryptoWatch
        run: |
          sed -i "s/applicationId 'com.smartcryptowatch.app'/applicationId 'com.smartcryptowatch.compat'/" app/build.gradle
          sed -i "s/minSdk 26/minSdk 23/" app/build.gradle
          sed -i "s/targetSdk 35/targetSdk 31/" app/build.gradle
          sed -i "s/versionCode 1/versionCode 2/" app/build.gradle
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCryptoWatch-Compat-APK
          path: buildsrc/SmartCryptoWatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
